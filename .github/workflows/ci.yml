name: CI

# Module 21 (SRS §14.12) - "the full automated cross-tenant test suite
# passes as a release gate" and "a dependency-vulnerability scan runs in
# CI and blocks a deliberately-introduced known-vulnerable dependency".
# Mark typecheck/unit-tests/dependency-audit/web-build and every
# "e2e-tests (N)" shard (or e2e-tests-summary - see D59 below) as required
# status checks in the repo's branch protection settings (GitHub UI:
# Settings -> Branches -> Branch protection rules) - this workflow makes
# the checks exist and run; requiring them on the default branch is a
# one-time, separate repo-admin action (see docs/launch-runbook.md).
#
# D59 (docs/founder-decisions-log.md): a commit touching nothing outside
# docs/ and CHANGELOG.md skips the 5 real jobs entirely (they report
# "skipped", which satisfies a required check without running it) - a
# docs-only diff cannot break a test, so paying the ~50-60 minute e2e
# wait on one is pure latency with no safety benefit. Any uncertainty
# (can't determine the diff, a non-push event, a force-push/rebase whose
# base commit isn't reachable) defaults to running everything - this
# optimization only ever skips work, never skips safety. See
# scripts/verify-ci-docs-only-skip-exclusions.sh (A2) for the proof that
# every path category the founder named - .github/**, lockfile,
# package.json, prisma, Dockerfiles, scripts, .env.example, config files
# - is covered: the filter is an allowlist of known-safe paths (docs/,
# CHANGELOG.md), not a denylist of known-dangerous ones, so anything not
# provably docs-only runs everything by construction.
#
# D93/A3 (2026-10-10): sharding (D59) cuts wall-clock, not total billable
# compute - run #206 (the first clean 4-way-sharded run) measured 69
# billable runner-minutes against 17m48s wall-clock, slightly MORE total
# compute than the old single-process e2e job, because each shard now
# pays its own "Initialize containers"/"Install Playwright" fixed cost.
# Two changes answer that: (1) the `full_run` scope below sends a
# feature-branch push through typecheck+unit-tests only - the full suite
# (e2e, dependency-audit, web-build) now runs only for a PR to main, a
# push to main, or the nightly schedule; (2) a Playwright browser-binary
# cache in e2e-tests, targeting exactly the redundant per-shard cost
# sharding introduced. `concurrency` below cancels a still-running old
# run on the same ref the moment a new push supersedes it.
#
# D94/A5 (2026-10-10): every Action is pinned to a full commit SHA, not a
# mutable tag - pnpm/action-setup@v4 was observed to move
# (b906affcce14559ad1aafd4ab0e942779e9f58b1 ->
# f40ffcd9367d9f12939873eb1018b921a783ffaa) during this project's own
# history, confirmed directly from two real CI job logs days apart, so
# this isn't a theoretical risk. .github/dependabot.yml keeps these pins
# current with weekly PRs instead of letting them silently rot.
# `permissions: contents: read` at the top level is deliberately NOT
# widened per-job: nothing in this workflow pushes, comments, or writes
# packages, and no job references `secrets.*` at all today, so a
# compromised Action or a fork PR has nothing here to exfiltrate. No
# `pull_request_target` is used anywhere in this workflow.

on:
  push: {}
  pull_request:
    branches: [main]
  schedule:
    # 02:17 UTC - off the top-of-hour/half-hour minute GitHub's own
    # scheduler queue is busiest at. Full suite, same as a PR/merge to
    # main; see the `changes` job's full_run scope step.
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      full_run: ${{ steps.scope.outputs.full_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50

      - name: Verify the A2 docs-only-skip exclusion list before trusting it this run
        run: ./scripts/verify-ci-docs-only-skip-exclusions.sh

      - name: Determine trigger scope - A3 (full suite vs feature-branch-only)
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Schedule/manual dispatch - full suite."
            echo "full_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "PR targeting main - full suite."
            echo "full_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Push to main (a merge, per D92 - no direct pushes) - full suite."
            echo "full_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Feature-branch push - typecheck/unit-tests only, per D93 (A3)."
            echo "full_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect whether this push touches anything beyond docs/CHANGELOG.md (D59)
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Not a push event (${{ github.event_name }}) - running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "No usable before-SHA in this checkout (new branch, or outside fetch-depth) - running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE_SHA" HEAD)
          echo "Changed files ($BEFORE_SHA..${{ github.sha }}):"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qvE '^(docs/|CHANGELOG\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only push - skipping the 5 real jobs." >&2
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check template isolation boundary (Templates module, THE ISOLATION RULE)
        run: node scripts/check-template-isolation.js
      - name: Generate Prisma client (needed for apps/api types)
        run: pnpm --filter @uzeyn/api prisma:generate
      - name: Typecheck apps/api
        run: pnpm --filter @uzeyn/api exec tsc --noEmit
      - name: Typecheck apps/web
        run: pnpm --filter @uzeyn/web exec tsc --noEmit

  unit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uzeyn/api prisma:generate
      - name: Unit tests (no external services required)
        run: pnpm test:api

  e2e-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full_run == 'true'
    runs-on: ubuntu-latest
    # Real Postgres + Redis, matching README's "Running tests" e2e
    # instructions exactly - this is the release gate for the cross-tenant/
    # RLS suite, not a mocked substitute. D59: 105 spec files sharded 4 ways
    # (Jest's own --shard=N/M) across 4 parallel runners, each with its own
    # fresh Postgres/Redis - cuts wall-clock from one ~50-60 minute
    # --maxWorkers=1 run to roughly a quarter of that, same total work,
    # same within-shard sequential-safety property the single-process run
    # relied on. See the e2e-tests-summary job below for the single stable
    # check name this fans back into. A3: runs only when `full_run` is
    # true (PR/push to main, schedule, manual dispatch) - never on a plain
    # feature-branch push.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
          POSTGRES_DB: uzeyn
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client (test files import PrismaClient directly)
        run: pnpm --filter @uzeyn/api prisma:generate

      - name: Resolve installed Playwright version (cache key)
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./apps/api/node_modules/playwright/package.json').version)")" >> "$GITHUB_OUTPUT"

      # A3: each of the 4 shards used to redownload the same Chromium
      # build independently - exactly the redundant per-shard cost that
      # made run #206 measure MORE total billable minutes than the old
      # single-process job despite a 3x faster wall-clock. Keyed on the
      # installed playwright package version, same pattern Playwright's
      # own CI docs recommend.
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium + system dependencies (PDF generation, cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @uzeyn/api exec playwright install --with-deps chromium

      - name: Install Playwright's OS-level dependencies only (browser binary already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @uzeyn/api exec playwright install-deps chromium

      - name: Bootstrap app_runtime/app_admin roles (once per fresh database)
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          psql -h localhost -U postgres -d uzeyn \
            -v runtime_password=ci-runtime-password \
            -v admin_password=ci-admin-password \
            -v dbname=uzeyn \
            -f apps/api/scripts/bootstrap-db.sql

      - name: Run migrations (as superuser - app roles only have DML rights)
        env:
          DATABASE_URL: postgresql://postgres:ci-superuser-password@localhost:5432/uzeyn?schema=public
        run: pnpm --filter @uzeyn/api exec prisma migrate deploy

      - name: Write apps/api/.env.test
        run: |
          # InvoicePdfService.renderPdfBuffer() overrides Playwright's
          # executablePath explicitly (its own fallback,
          # `/opt/pw-browsers/chromium`, only resolves on developer sandboxes
          # that happen to symlink it there - a plain CI runner has no such
          # symlink). Ask Playwright's own API where it actually installed
          # Chromium on THIS runner rather than guessing a path/version.
          CHROMIUM_PATH=$(pnpm --filter @uzeyn/api exec node -e "console.log(require('playwright').chromium.executablePath())")
          cat > apps/api/.env.test <<EOF
          NODE_ENV=test
          PORT=3000
          DATABASE_URL=postgresql://app_runtime:ci-runtime-password@localhost:5432/uzeyn?schema=public
          DATABASE_ADMIN_URL=postgresql://app_admin:ci-admin-password@localhost:5432/uzeyn?schema=public
          TEST_SUPERUSER_DATABASE_URL=postgresql://postgres:ci-superuser-password@localhost:5432/uzeyn?schema=public
          REDIS_URL=redis://localhost:6379
          JWT_ACCESS_SECRET=ci-test-secret-not-for-production-use-1234567890
          JWT_ACCESS_TTL_MINUTES=15
          JWT_REFRESH_TTL_DAYS=30
          ADMIN_MFA_ISSUER_NAME=uzeyn.com
          EMAIL_PROVIDER=console
          EMAIL_FROM_ADDRESS=no-reply@uzeyn.com
          APP_BASE_URL=http://localhost:3001
          PLAYWRIGHT_CHROMIUM_PATH=$CHROMIUM_PATH
          MINIO_ENDPOINT=http://localhost:4569
          MINIO_ROOT_USER=S3RVER
          MINIO_ROOT_PASSWORD=S3RVER
          MINIO_BUCKET=uzeyn-media-test
          GOOGLE_DRIVE_CLIENT_ID=test-client-id
          GOOGLE_DRIVE_CLIENT_SECRET=test-client-secret
          GOOGLE_DRIVE_REDIRECT_URI=http://localhost:3000/media/drive/callback
          DRIVE_TOKEN_ENCRYPTION_KEY=cVKW5U8XxG2Wn9GxwZ8v4vQY2ZC1o9dCmR3hT5nQmZ4=
          PRINTIFY_API_KEY=ci-test-printify-key-placeholder
          TRAEFIK_DYNAMIC_CONFIG_DIR=/tmp/uzeyn-traefik-dynamic-test
          IDENTITY_ENCRYPTION_KEY=hPVvBmwP4FUPhlWoIzKOyj1FZ1UBu0N+AbNgZoVNsPk=
          IDENTITY_FINGERPRINT_HMAC_SECRET=ci-test-identity-fingerprint-hmac-secret
          EXTERNAL_API_SECRET_ENCRYPTION_KEY=UBSQp73iyfU/LUU+gFQ69pB9C2Gw1Tg1RVqSmuM/FdE=
          SMTP_CREDENTIAL_ENCRYPTION_KEY=4NqGx0iUuAW/T+K88NSUB7b8pFHLXhUqVsVvzuyi6Qk=
          ADMIN_EMAIL_CREDENTIAL_ENCRYPTION_KEY=52ndSUecSgtM/FnxNWrvun1iPK21rzJhKgZV0I/fBPg=
          PAYMENT_GATEWAY_CREDENTIAL_ENCRYPTION_KEY=p6bqHrEqJhlod/7+aS0aCDwGrcSGeGx6s5a+EBTH+jg=
          EOF

      - name: "E2E tests, shard ${{ matrix.shard }}/4 (real Postgres + Redis - the cross-tenant/RLS release gate)"
        # Same single-worker-per-process safety the old unsharded run used
        # (--maxWorkers=1, no --runInBand needed alongside it) - just 4 of
        # these processes now, each on its own runner/DB, instead of 1.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @uzeyn/api test:e2e --shard=${{ matrix.shard }}/4

  # D59: sharding e2e-tests gives each shard its own check name
  # ("e2e-tests (1)" .. "e2e-tests (4)"), which would otherwise mean
  # branch protection has to name all 4 individually and re-name them
  # every time the shard count changes. This job fans them back into one
  # stable name - require THIS in branch protection, not the per-shard
  # ones. Passes if every shard succeeded, or if e2e-tests didn't run at
  # all (a docs-only push or a feature-branch push, both correctly
  # skipped above); fails only on a real shard failure or cancellation.
  e2e-tests-summary:
    needs: [changes, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check e2e shard results
        run: |
          result="${{ needs.e2e-tests.result }}"
          echo "e2e-tests matrix result: $result"
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            exit 0
          fi
          exit 1

  dependency-audit:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Blocking audit (critical severity)
        run: pnpm run audit

      - name: Informational audit (high severity - reported, not blocking)
        run: pnpm run audit:report

      - name: Prove the audit mechanism itself blocks a known-vulnerable package
        run: pnpm run verify:dependency-audit-mechanism

      - name: Secrets scan (gitleaks)
        # Security-checklist audit finding: the clean result on record
        # (docs/security-audit-report.md §3 #16) was a one-time manual
        # full-history scan, not a recurring gate - nothing stopped a new
        # secret from being committed and sitting undetected since. Runs
        # the open-source gitleaks CLI directly (no third-party Action/
        # license needed) against the current checkout's file content
        # (--no-git), so it catches a secret present in the final tree
        # this push produces, on every push. Pinned by release version in
        # the URL itself (v8.21.2), not a floating tag.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --redact -v

  web-build:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full_run == 'true'
    runs-on: ubuntu-latest
    # apps/web has no automated test suite (see README's Module 4/5
    # disclosures) - a production build is the closest automated proxy:
    # it fails on type errors, broken imports, and invalid static
    # generation, same as the manual `next build` smoke test README
    # already documents for local verification.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uzeyn/web build
