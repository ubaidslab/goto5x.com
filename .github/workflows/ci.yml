name: CI

# Module 21 (SRS §14.12) - "the full automated cross-tenant test suite
# passes as a release gate" and "a dependency-vulnerability scan runs in
# CI and blocks a deliberately-introduced known-vulnerable dependency".
# Mark typecheck/unit-tests/db-role-grants/dependency-audit/web-build and
# every "e2e-tests (N)" shard (or e2e-tests-summary - see D59 below) as
# required status checks in the repo's branch protection settings (GitHub
# UI: Settings -> Branches -> Branch protection rules), alongside "require
# a pull request before merging" (the actual bypass-prevention control -
# founder item 1, 2026-10-11) - this workflow makes the checks exist and
# run; requiring them on the default branch is a one-time, separate
# repo-admin action no API token available to a Claude Code session can
# perform (tried; only read access to branch-protection state exists) -
# see docs/launch-runbook.md's new "0. Repository branch protection"
# section for the full, current checklist including `main`'s confirmed
# `protected: false` state as of that date.
#
# D59 (docs/founder-decisions-log.md): a commit touching nothing outside
# docs/ and CHANGELOG.md skips the 5 real jobs entirely (they report
# "skipped", which satisfies a required check without running it) - a
# docs-only diff cannot break a test, so paying the ~50-60 minute e2e
# wait on one is pure latency with no safety benefit. Any uncertainty
# (can't determine the diff, a non-push event, a force-push/rebase whose
# base commit isn't reachable) defaults to running everything - this
# optimization only ever skips work, never skips safety. See
# scripts/verify-ci-docs-only-skip-exclusions.sh (A2) for the proof that
# every path category the founder named - .github/**, lockfile,
# package.json, prisma, Dockerfiles, scripts, .env.example, config files
# - is covered: the filter is an allowlist of known-safe paths (docs/,
# CHANGELOG.md), not a denylist of known-dangerous ones, so anything not
# provably docs-only runs everything by construction.
#
# D93/A3 (2026-10-10): sharding (D59) cuts wall-clock, not total billable
# compute - run #206 (the first clean 4-way-sharded run) measured 69
# billable runner-minutes against 17m48s wall-clock, slightly MORE total
# compute than the old single-process e2e job, because each shard now
# pays its own "Initialize containers"/"Install Playwright" fixed cost.
# Two changes answer that: (1) the `full_run` scope below sends a
# feature-branch push through typecheck+unit-tests only - the full suite
# (e2e, dependency-audit, web-build) now runs only for a PR to main, a
# push to main, or the nightly schedule; (2) a Playwright browser-binary
# cache in e2e-tests, targeting exactly the redundant per-shard cost
# sharding introduced. `concurrency` below cancels a still-running old
# run on the same ref the moment a new push supersedes it.
#
# D94/A5 (2026-10-10): every Action is pinned to a full commit SHA, not a
# mutable tag - pnpm/action-setup@v4 was observed to move
# (b906affcce14559ad1aafd4ab0e942779e9f58b1 ->
# f40ffcd9367d9f12939873eb1018b921a783ffaa) during this project's own
# history, confirmed directly from two real CI job logs days apart, so
# this isn't a theoretical risk. .github/dependabot.yml keeps these pins
# current with weekly PRs instead of letting them silently rot.
# `permissions: contents: read` at the top level is deliberately NOT
# widened per-job: nothing in this workflow pushes, comments, or writes
# packages, and no job references `secrets.*` at all today, so a
# compromised Action or a fork PR has nothing here to exfiltrate. No
# `pull_request_target` is used anywhere in this workflow.
#
# D107 follow-up (2026-10-15): every `pnpm/action-setup` step below passes
# no `version:` input any more. Root package.json's new `packageManager`
# field (added to fix a separate Docker/corepack version-drift bug, D107)
# is picked up by this Action automatically - and pnpm/action-setup
# actively refuses to run at all when both a `version:` input and a
# `packageManager` field are present ("Multiple versions of pnpm
# specified"), so keeping the old explicit `version: "10"` here isn't a
# harmless belt-and-suspenders - it hard-fails every job. One source of
# truth now, which is the better outcome this pin was already trying to
# protect against drifting anyway.

on:
  push: {}
  pull_request:
    branches: [main]
  schedule:
    # 02:17 UTC - off the top-of-hour/half-hour minute GitHub's own
    # scheduler queue is busiest at. Full suite, same as a PR/merge to
    # main; see the `changes` job's full_run scope step.
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      full_run: ${{ steps.scope.outputs.full_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 50

      - name: Verify the A2 docs-only-skip exclusion list before trusting it this run
        run: ./scripts/verify-ci-docs-only-skip-exclusions.sh

      - name: Determine trigger scope - A3 (full suite vs feature-branch-only)
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Schedule/manual dispatch - full suite."
            echo "full_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "PR targeting main - full suite."
            echo "full_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Push to main (a merge, per D92 - no direct pushes) - full suite."
            echo "full_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Feature-branch push - typecheck/unit-tests only, per D93 (A3)."
            echo "full_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect whether this push touches anything beyond docs/CHANGELOG.md (D59)
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Not a push event (${{ github.event_name }}) - running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "No usable before-SHA in this checkout (new branch, or outside fetch-depth) - running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE_SHA" HEAD)
          echo "Changed files ($BEFORE_SHA..${{ github.sha }}):"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qvE '^(docs/|CHANGELOG\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only push - skipping the 5 real jobs." >&2
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check template isolation boundary (Templates module, THE ISOLATION RULE)
        run: node scripts/check-template-isolation.js
      - name: Generate Prisma client (needed for apps/api types)
        run: pnpm --filter @uzeyn/api prisma:generate
      - name: Typecheck apps/api
        run: pnpm --filter @uzeyn/api exec tsc --noEmit
      - name: Typecheck apps/web
        run: pnpm --filter @uzeyn/web exec tsc --noEmit

  # Founder item 6 (D99, 2026-10-11) - this repo's first lint CI job.
  # `pnpm --filter @uzeyn/api lint`/`next lint` existed as scripts before
  # this, but nothing backed them (no eslint.config.* anywhere, no eslint
  # in either app's own devDependencies) - confirmed broken, not just
  # unwired: running either locally failed outright. apps/api's
  # eslint.config.mjs and apps/web's .eslintrc.json are new alongside this
  # job. Same cheap tier as typecheck/unit-tests (every code-touching
  # push, not gated behind full_run) - a lint pass takes seconds, same
  # reasoning as D59's typecheck placement.
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uzeyn/api prisma:generate
      - name: Lint apps/api (ESLint - typescript-eslint recommended, not type-checked)
        run: pnpm --filter @uzeyn/api lint
      - name: Lint apps/web (next lint - next/core-web-vitals)
        run: pnpm --filter @uzeyn/web lint

  # Security P0 (Risk #48, S12) - the non-root-user half of "pinned Actions
  # by commit SHA (done, A5/D94), non-root images (this job)". No Dockerfile
  # was ever built in CI before this - confirmed by reading this file
  # fresh, Dockerfiles were previously only mentioned in the docs-only-skip
  # filter's exclusion comment above. Builds each production target (no
  # push - no registry/credentials needed) and proves the new non-root
  # `USER node` can actually read the exact file it needs to execute,
  # which is precisely the failure mode a wrong --chown would cause
  # (EACCES at startup) - a full app boot would additionally need real
  # Postgres/Redis/the whole boot-validated env-var list just to get past
  # config validation, disproportionate for what this check is actually
  # verifying.
  docker-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build apps/api production image
        run: docker build --target production -t uzeyn-api:ci -f apps/api/Dockerfile .

      - name: Build apps/api worker production image
        run: docker build --target production -t uzeyn-api-worker:ci -f apps/api/Dockerfile.worker .

      - name: Build apps/web production image
        run: docker build --target production -t uzeyn-web:ci -f apps/web/Dockerfile .

      - name: Verify every image runs as the non-root `node` user and can read its own app code
        run: |
          for pair in "uzeyn-api:ci dist/src/main.js" "uzeyn-api-worker:ci dist/src/worker/worker.main.js" "uzeyn-web:ci .next"; do
            image=$(echo "$pair" | cut -d' ' -f1)
            entry=$(echo "$pair" | cut -d' ' -f2)
            uid=$(docker run --rm "$image" id -u)
            if [ "$uid" = "0" ]; then
              echo "$image is running as root (uid 0) - USER node did not take effect"
              exit 1
            fi
            docker run --rm "$image" node -e "require('fs').accessSync('$entry', require('fs').constants.R_OK)"
            echo "$image OK - runs as uid $uid, can read $entry"
          done

  unit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uzeyn/api prisma:generate
      - name: Unit tests (no external services required)
        run: pnpm test:api

  db-role-grants:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Founder item 2 (2026-10-11) - real Postgres, no Redis/Playwright
    # needed (cheap: bootstrap + migrations + bootstrap-db.sql twice more +
    # two assertion queries). Proves bootstrap-db.sql is order-safe:
    # bootstrap-db.sql runs once first (roles must exist before migrations
    # even apply - the rls_and_audit_grants migration's own REVOKE
    # statements reference app_runtime/app_admin and fail outright against
    # a database that has never been bootstrapped, caught by this job's own
    # first real CI run: "ERROR: role app_runtime does not exist"), then
    # migrations run (each append-only table's own REVOKE now succeeds),
    # then bootstrap-db.sql runs TWICE MORE - the exact hazard that let
    # app_runtime/app_admin regain UPDATE/DELETE on
    # admin_audit_logs/platform_events after a bootstrap re-run (found in
    # a local dev sandbox, not production, but the same script runs in
    # both - see apps/api/scripts/bootstrap-db.sql's own comment).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
          POSTGRES_DB: uzeyn
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uzeyn/api prisma:generate

      - name: Run bootstrap-db.sql once first - roles must exist before any migration's own REVOKE can reference them
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          psql -h localhost -U postgres -d uzeyn \
            -v runtime_password=ci-runtime-password \
            -v admin_password=ci-admin-password \
            -v dbname=uzeyn \
            -f apps/api/scripts/bootstrap-db.sql

      - name: Run migrations (as superuser) - establishes each append-only table's own REVOKE
        env:
          DATABASE_URL: postgresql://postgres:ci-superuser-password@localhost:5432/uzeyn?schema=public
        run: pnpm --filter @uzeyn/api exec prisma migrate deploy

      - name: Run bootstrap-db.sql again (post-migration) - the exact hazard this job exists to catch
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          psql -h localhost -U postgres -d uzeyn \
            -v runtime_password=ci-runtime-password \
            -v admin_password=ci-admin-password \
            -v dbname=uzeyn \
            -f apps/api/scripts/bootstrap-db.sql

      - name: Run bootstrap-db.sql a third time (second post-migration run) - proving this, not just one re-run, stays safe
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          psql -h localhost -U postgres -d uzeyn \
            -v runtime_password=ci-runtime-password \
            -v admin_password=ci-admin-password \
            -v dbname=uzeyn \
            -f apps/api/scripts/bootstrap-db.sql

      - name: Assert every append-only table is still insert+select only for both roles
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          actual=$(psql -h localhost -U postgres -d uzeyn -t -A -F',' -c "
            SELECT table_name, grantee, string_agg(privilege_type, '|' ORDER BY privilege_type)
            FROM information_schema.role_table_grants
            WHERE table_schema = 'public'
              AND grantee IN ('app_runtime', 'app_admin')
              AND table_name IN ('admin_audit_logs', 'user_security_events', 'platform_events', 'milestone_events', 'stock_adjustments')
            GROUP BY table_name, grantee
            ORDER BY table_name, grantee;
          ")
          echo "$actual"
          expected='admin_audit_logs,app_admin,INSERT|SELECT
          admin_audit_logs,app_runtime,INSERT|SELECT
          milestone_events,app_admin,INSERT|SELECT
          milestone_events,app_runtime,INSERT|SELECT
          platform_events,app_admin,INSERT|SELECT
          platform_events,app_runtime,INSERT|SELECT
          stock_adjustments,app_admin,INSERT|SELECT
          stock_adjustments,app_runtime,INSERT|SELECT
          user_security_events,app_admin,INSERT|SELECT
          user_security_events,app_runtime,INSERT|SELECT'
          expected_trimmed=$(echo "$expected" | sed 's/^[[:space:]]*//')
          if [ "$actual" != "$expected_trimmed" ]; then
            echo "MISMATCH - append-only table grants are not exactly insert+select for both roles after a second bootstrap-db.sql run"
            echo "--- expected ---"
            echo "$expected_trimmed"
            echo "--- actual ---"
            echo "$actual"
            exit 1
          fi
          echo "OK - every append-only table stayed insert+select only for both roles, even after bootstrap-db.sql ran twice post-migration"

      - name: Assert an ordinary table (orders) still has full DML - the fix must not over-narrow
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          actual=$(psql -h localhost -U postgres -d uzeyn -t -A -c "
            SELECT string_agg(privilege_type, '|' ORDER BY privilege_type)
            FROM information_schema.role_table_grants
            WHERE table_schema = 'public' AND table_name = 'orders' AND grantee = 'app_runtime';
          ")
          echo "orders/app_runtime privileges: $actual"
          if [ "$actual" != "DELETE|INSERT|SELECT|UPDATE" ]; then
            echo "orders should still have full DML for app_runtime - got: $actual"
            exit 1
          fi

  backup-restore-drill:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # D116 item 6 (Stage 0) - "automated daily DB backups plus one tested
    # restore." Backups themselves are already automated (backups/database-
    # backup.service.ts, running in the worker process against a real
    # off-box S3 target); what's actually missing is proof that the restore
    # SIDE of docs/launch-runbook.md's §6 procedure keeps working, on every
    # change, not as a one-off manual drill the founder has to remember to
    # repeat. This job runs the REAL pg_dump invocation DatabaseBackupService
    # itself uses (same DATABASE_ADMIN_URL, same plain-text-then-gzip
    # shape), then restores it with the runbook's own `-v ON_ERROR_STOP=1`
    # discipline into a scratch database and checks two things a "the app
    # booted and the row counts matched" check would miss: that the row
    # pg_dump captured actually comes back, and that every foreign-key
    # constraint survives (the exact class of failure §6 already documents
    # finding once, silently, without this flag).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
          POSTGRES_DB: uzeyn
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uzeyn/api prisma:generate

      - name: Bootstrap app_runtime/app_admin roles, then run migrations - same order db-role-grants already proved is required
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          psql -h localhost -U postgres -d uzeyn \
            -v runtime_password=ci-runtime-password \
            -v admin_password=ci-admin-password \
            -v dbname=uzeyn \
            -f apps/api/scripts/bootstrap-db.sql
      - run: pnpm --filter @uzeyn/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:ci-superuser-password@localhost:5432/uzeyn?schema=public

      - name: Insert a deterministic marker row + capture the real FK constraint list before backing up
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          psql -h localhost -U postgres -d uzeyn -c "
            CREATE TABLE backup_drill_marker (id text PRIMARY KEY, value text NOT NULL);
            INSERT INTO backup_drill_marker (id, value) VALUES ('drill', 'uzeyn-backup-restore-drill');
          "
          psql -h localhost -U postgres -d uzeyn -t -A -c "
            SELECT conname FROM pg_constraint WHERE contype = 'f' ORDER BY 1;
          " > /tmp/fk-before.txt
          echo "Captured $(wc -l < /tmp/fk-before.txt) foreign-key constraint names before backup."

      - name: pg_dump against DATABASE_ADMIN_URL + gzip - the exact invocation DatabaseBackupService uses in production
        run: |
          pg_dump "postgresql://app_admin:ci-admin-password@localhost:5432/uzeyn" | gzip > /tmp/backup.sql.gz
          ls -la /tmp/backup.sql.gz

      - name: Restore into a scratch database, with ON_ERROR_STOP=1 (docs/launch-runbook.md §6's own documented, previously-missing discipline)
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          psql -h localhost -U postgres -d uzeyn -c "CREATE DATABASE uzeyn_restore_drill;"
          gunzip -c /tmp/backup.sql.gz | psql -h localhost -U postgres -d uzeyn_restore_drill -v ON_ERROR_STOP=1

      - name: Verify the marker row survived the restore
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          actual=$(psql -h localhost -U postgres -d uzeyn_restore_drill -t -A -c "SELECT value FROM backup_drill_marker WHERE id = 'drill';")
          if [ "$actual" != "uzeyn-backup-restore-drill" ]; then
            echo "Marker row missing or wrong after restore - got: '$actual'"
            exit 1
          fi
          echo "OK - marker row survived pg_dump + restore unchanged."

      - name: Verify every foreign-key constraint survived the restore (the exact silent-drop failure §6 documents)
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          psql -h localhost -U postgres -d uzeyn_restore_drill -t -A -c "
            SELECT conname FROM pg_constraint WHERE contype = 'f' ORDER BY 1;
          " > /tmp/fk-after.txt
          if ! diff -q /tmp/fk-before.txt /tmp/fk-after.txt > /dev/null; then
            echo "MISMATCH - the restored database's foreign-key constraints differ from the source. Missing/extra:"
            diff /tmp/fk-before.txt /tmp/fk-after.txt
            exit 1
          fi
          echo "OK - all $(wc -l < /tmp/fk-after.txt) foreign-key constraints survived the restore unchanged."

  kms-localstack-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # D117/D126 (founder decision) - "tested with mocks/LocalStack in CI."
    # aws-kms.provider.spec.ts (the unit suite above) already proves
    # AwsKmsProvider's own logic against a mocked AWS SDK client; this job
    # is the other half the founder explicitly asked for - a real round
    # trip over the network, with the real AWS SDK's request signing/wire
    # format, against a LocalStack-emulated KMS endpoint, not a mock.
    # Same cheap tier as backup-restore-drill (no Postgres/Redis/Playwright
    # needed here).
    services:
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: kms
        ports: ["4566:4566"]
        options: >-
          --health-cmd="curl -sf http://localhost:4566/_localstack/health"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uzeyn/api prisma:generate

      - name: Create a test CMK in LocalStack's emulated KMS
        id: create-key
        env:
          AWS_ACCESS_KEY_ID: localstack-dummy-access-key-id
          AWS_SECRET_ACCESS_KEY: localstack-dummy-secret-access-key
          AWS_DEFAULT_REGION: us-east-1
        run: |
          key_id=$(aws --endpoint-url http://localhost:4566 kms create-key \
            --description "uzeyn CI kms-localstack-test" \
            --query 'KeyMetadata.KeyId' --output text)
          echo "Created CMK: $key_id"
          echo "key_id=$key_id" >> "$GITHUB_OUTPUT"

      - name: Real GenerateDataKey -> Decrypt round trip against LocalStack (AwsKmsProvider)
        env:
          AWS_ACCESS_KEY_ID: localstack-dummy-access-key-id
          AWS_SECRET_ACCESS_KEY: localstack-dummy-secret-access-key
          AWS_REGION: us-east-1
          AWS_KMS_KEY_ID: ${{ steps.create-key.outputs.key_id }}
          AWS_KMS_ENDPOINT: http://localhost:4566
        run: pnpm --filter @uzeyn/api exec ts-node scripts/verify-kms-localstack.ts

  stripe-mock-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # D117/B2 (founder decision, sandbox only) - stripe-gateway.adapter.
    # spec.ts and stripe-webhook.controller.spec.ts already prove the
    # logic against a mocked SDK client; this job is the real round
    # trip the kms-localstack-test job above already established the
    # pattern for - the real Stripe SDK's request signing/wire format,
    # against Stripe's own open-source stripe-mock fake API server, not
    # a mock. Same cheap tier as backup-restore-drill/kms-localstack-
    # test (no Postgres/Redis/Playwright needed here).
    services:
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ["12111:12111"]
        options: >-
          --health-cmd="wget -qO- --header='Authorization: Bearer sk_test_ci' http://localhost:12111/v1/charges"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Real Checkout Session create -> retrieve round trip + webhook signature verification against stripe-mock
        env:
          STRIPE_API_HOST: localhost:12111
        run: pnpm --filter @uzeyn/api exec ts-node scripts/verify-stripe-mock.ts

  e2e-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full_run == 'true'
    runs-on: ubuntu-latest
    # Real Postgres + Redis, matching README's "Running tests" e2e
    # instructions exactly - this is the release gate for the cross-tenant/
    # RLS suite, not a mocked substitute. D59: 105 spec files sharded 4 ways
    # (Jest's own --shard=N/M) across 4 parallel runners, each with its own
    # fresh Postgres/Redis - cuts wall-clock from one ~50-60 minute
    # --maxWorkers=1 run to roughly a quarter of that, same total work,
    # same within-shard sequential-safety property the single-process run
    # relied on. See the e2e-tests-summary job below for the single stable
    # check name this fans back into. A3: runs only when `full_run` is
    # true (PR/push to main, schedule, manual dispatch) - never on a plain
    # feature-branch push.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
          POSTGRES_DB: uzeyn
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client (test files import PrismaClient directly)
        run: pnpm --filter @uzeyn/api prisma:generate

      - name: Resolve installed Playwright version (cache key)
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./apps/api/node_modules/playwright/package.json').version)")" >> "$GITHUB_OUTPUT"

      # A3: each of the 4 shards used to redownload the same Chromium
      # build independently - exactly the redundant per-shard cost that
      # made run #206 measure MORE total billable minutes than the old
      # single-process job despite a 3x faster wall-clock. Keyed on the
      # installed playwright package version, same pattern Playwright's
      # own CI docs recommend.
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium + system dependencies (PDF generation, cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @uzeyn/api exec playwright install --with-deps chromium

      - name: Install Playwright's OS-level dependencies only (browser binary already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @uzeyn/api exec playwright install-deps chromium

      - name: Bootstrap app_runtime/app_admin roles (once per fresh database)
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          psql -h localhost -U postgres -d uzeyn \
            -v runtime_password=ci-runtime-password \
            -v admin_password=ci-admin-password \
            -v dbname=uzeyn \
            -f apps/api/scripts/bootstrap-db.sql

      - name: Run migrations (as superuser - app roles only have DML rights)
        env:
          DATABASE_URL: postgresql://postgres:ci-superuser-password@localhost:5432/uzeyn?schema=public
        run: pnpm --filter @uzeyn/api exec prisma migrate deploy

      - name: Write apps/api/.env.test
        run: |
          # InvoicePdfService.renderPdfBuffer() overrides Playwright's
          # executablePath explicitly (its own fallback,
          # `/opt/pw-browsers/chromium`, only resolves on developer sandboxes
          # that happen to symlink it there - a plain CI runner has no such
          # symlink). Ask Playwright's own API where it actually installed
          # Chromium on THIS runner rather than guessing a path/version.
          CHROMIUM_PATH=$(pnpm --filter @uzeyn/api exec node -e "console.log(require('playwright').chromium.executablePath())")
          cat > apps/api/.env.test <<EOF
          NODE_ENV=test
          PORT=3000
          DATABASE_URL=postgresql://app_runtime:ci-runtime-password@localhost:5432/uzeyn?schema=public
          DATABASE_ADMIN_URL=postgresql://app_admin:ci-admin-password@localhost:5432/uzeyn?schema=public
          TEST_SUPERUSER_DATABASE_URL=postgresql://postgres:ci-superuser-password@localhost:5432/uzeyn?schema=public
          REDIS_URL=redis://localhost:6379
          JWT_ACCESS_SECRET=ci-test-secret-not-for-production-use-1234567890
          JWT_ACCESS_TTL_MINUTES=15
          JWT_REFRESH_TTL_DAYS=30
          ADMIN_MFA_ISSUER_NAME=uzeyn.com
          EMAIL_PROVIDER=console
          EMAIL_FROM_ADDRESS=no-reply@uzeyn.com
          APP_BASE_URL=http://localhost:3001
          PLAYWRIGHT_CHROMIUM_PATH=$CHROMIUM_PATH
          MINIO_ENDPOINT=http://localhost:4569
          MINIO_ROOT_USER=S3RVER
          MINIO_ROOT_PASSWORD=S3RVER
          MINIO_BUCKET=uzeyn-media-test
          GOOGLE_DRIVE_CLIENT_ID=test-client-id
          GOOGLE_DRIVE_CLIENT_SECRET=test-client-secret
          GOOGLE_DRIVE_REDIRECT_URI=http://localhost:3000/media/drive/callback
          DRIVE_TOKEN_ENCRYPTION_KEY=cVKW5U8XxG2Wn9GxwZ8v4vQY2ZC1o9dCmR3hT5nQmZ4=
          PRINTIFY_API_KEY=ci-test-printify-key-placeholder
          TRAEFIK_DYNAMIC_CONFIG_DIR=/tmp/uzeyn-traefik-dynamic-test
          IDENTITY_ENCRYPTION_KEY=hPVvBmwP4FUPhlWoIzKOyj1FZ1UBu0N+AbNgZoVNsPk=
          IDENTITY_FINGERPRINT_HMAC_SECRET=ci-test-identity-fingerprint-hmac-secret
          EXTERNAL_API_SECRET_ENCRYPTION_KEY=UBSQp73iyfU/LUU+gFQ69pB9C2Gw1Tg1RVqSmuM/FdE=
          SMTP_CREDENTIAL_ENCRYPTION_KEY=4NqGx0iUuAW/T+K88NSUB7b8pFHLXhUqVsVvzuyi6Qk=
          ADMIN_EMAIL_CREDENTIAL_ENCRYPTION_KEY=52ndSUecSgtM/FnxNWrvun1iPK21rzJhKgZV0I/fBPg=
          PAYMENT_GATEWAY_CREDENTIAL_ENCRYPTION_KEY=p6bqHrEqJhlod/7+aS0aCDwGrcSGeGx6s5a+EBTH+jg=
          KMS_PROVIDER_TYPE=local-dev
          LOCAL_DEV_KMS_MASTER_KEY=LGMjNgKGhPONGzz7lRH+9xj/RUzdi14fjXbuOk1a3tw=
          EOF

      - name: "E2E tests, shard ${{ matrix.shard }}/4 (real Postgres + Redis - the cross-tenant/RLS release gate)"
        # Same single-worker-per-process safety the old unsharded run used
        # (--maxWorkers=1, no --runInBand needed alongside it) - just 4 of
        # these processes now, each on its own runner/DB, instead of 1.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @uzeyn/api test:e2e --shard=${{ matrix.shard }}/4

  # D59: sharding e2e-tests gives each shard its own check name
  # ("e2e-tests (1)" .. "e2e-tests (4)"), which would otherwise mean
  # branch protection has to name all 4 individually and re-name them
  # every time the shard count changes. This job fans them back into one
  # stable name - require THIS in branch protection, not the per-shard
  # ones. Passes if every shard succeeded, or if e2e-tests didn't run at
  # all (a docs-only push or a feature-branch push, both correctly
  # skipped above); fails only on a real shard failure or cancellation.
  e2e-tests-summary:
    needs: [changes, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check e2e shard results
        run: |
          result="${{ needs.e2e-tests.result }}"
          echo "e2e-tests matrix result: $result"
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            exit 0
          fi
          exit 1

  dependency-audit:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Blocking audit (critical severity)
        run: pnpm run audit

      - name: Informational audit (high severity - reported, not blocking)
        run: pnpm run audit:report

      - name: Prove the audit mechanism itself blocks a known-vulnerable package
        run: pnpm run verify:dependency-audit-mechanism

      - name: Secrets scan (gitleaks)
        # Security-checklist audit finding: the clean result on record
        # (docs/security-audit-report.md §3 #16) was a one-time manual
        # full-history scan, not a recurring gate - nothing stopped a new
        # secret from being committed and sitting undetected since. Runs
        # the open-source gitleaks CLI directly (no third-party Action/
        # license needed) against the current checkout's file content
        # (--no-git), so it catches a secret present in the final tree
        # this push produces, on every push. Pinned by release version in
        # the URL itself (v8.21.2), not a floating tag.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --redact -v

  web-build:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full_run == 'true'
    runs-on: ubuntu-latest
    # apps/web has no automated test suite (see README's Module 4/5
    # disclosures) - a production build is the closest automated proxy:
    # it fails on type errors, broken imports, and invalid static
    # generation, same as the manual `next build` smoke test README
    # already documents for local verification.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4, resolved 2026-10-10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uzeyn/web build
